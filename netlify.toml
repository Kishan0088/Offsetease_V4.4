[build]
  command = "node src/build.mjs && node src/check.mjs"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# Extensionless URLs, matching the canonical tags.
[[redirects]]
  from = "/:slug"
  to = "/:slug.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
