# Netlify serves this site from a domain root, while the repository root holds
# the GitHub Pages build, which is prefixed with /Offsetease_V4.4. The two
# cannot share one set of files, so the Netlify target is built separately.
#
#   SITE_ORIGIN=https://offsetease-v1-2.netlify.app SITE_BASE= \
#   OUT_DIR=netlify-dist node src/build.mjs
#
# The build command below reproduces that on Netlify's own builders, so a
# git-linked deploy produces root-relative paths rather than sub-path ones.

[build]
  publish = "netlify-dist"
  # Assets are copied BEFORE the build, not after: the build fingerprints
  # site.css and app.js into assets/, and copying over the top of an existing
  # directory would nest it as assets/assets and 404 every stylesheet.
  command = "rm -rf netlify-dist && mkdir -p netlify-dist && cp -R assets netlify-dist/assets && cp _headers netlify-dist/ && SITE_ORIGIN=$SITE_ORIGIN SITE_BASE= OUT_DIR=netlify-dist node src/build.mjs"

[build.environment]
  NODE_VERSION = "20"
  SITE_ORIGIN = "https://offsetease-v1-2.netlify.app"
